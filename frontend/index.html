<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockSense AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #172033;
    }

    header {
      background: #111827;
      color: white;
      padding: 24px 40px;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 6px;
      color: #cbd5e1;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .card h3 {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .card strong {
      font-size: 30px;
    }

    .section {
      background: white;
      padding: 24px;
      border-radius: 14px;
      margin-bottom: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .section h2 {
      margin-bottom: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 13px;
      text-align: left;
      border-bottom: 1px solid #e5e7eb;
    }

    th {
      background: #f8fafc;
    }

    .critical {
      color: #dc2626;
      font-weight: bold;
    }

    .high {
      color: #ea580c;
      font-weight: bold;
    }

    .loading {
      color: #64748b;
      padding: 15px 0;
    }

    @media(max-width: 800px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<header>
  <h1>StockSense AI</h1>
  <p>From Raw Retail Data to Decisions You Can Defend.</p>
</header>

<div class="container">

  <div class="cards">
    <div class="card">
      <h3>Products</h3>
      <strong id="products">-</strong>
    </div>

    <div class="card">
      <h3>Critical Risk</h3>
      <strong id="critical">-</strong>
    </div>

    <div class="card">
      <h3>High Risk</h3>
      <strong id="high">-</strong>
    </div>

    <div class="card">
      <h3>Data Rows</h3>
      <strong id="rows">-</strong>
    </div>
  </div>

  <div class="section">
    <h2>Inventory Risk</h2>

    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Category</th>
          <th>Stock</th>
          <th>Avg Daily Sales</th>
          <th>Inventory Cover</th>
          <th>Risk</th>
        </tr>
      </thead>

      <tbody id="riskTable">
        <tr>
          <td colspan="6" class="loading">Loading inventory data...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="section">
    <h2>Top Selling Products</h2>

    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Units Sold</th>
          <th>Revenue</th>
        </tr>
      </thead>

      <tbody id="topTable">
        <tr>
          <td colspan="3" class="loading">Loading...</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<script>
async function loadDashboard() {

  try {

    const productsResponse = await fetch("/api/products");
    const productsData = await productsResponse.json();

    document.getElementById("products").textContent =
      productsData.products.length;

    const summaryResponse =
      await fetch("/api/dataset/summary");

    const summaryData =
      await summaryResponse.json();

    document.getElementById("rows").textContent =
      summaryData.summary.row_count;

    const riskResponse =
      await fetch("/api/analytics/stock-risk");

    const riskData =
      await riskResponse.json();

    const risks = riskData.stock_risk || [];

    document.getElementById("critical").textContent =
      risks.filter(x => x.stock_risk === "CRITICAL").length;

    document.getElementById("high").textContent =
      risks.filter(x => x.stock_risk === "HIGH").length;

    const riskTable =
      document.getElementById("riskTable");

    riskTable.innerHTML = "";

    risks.forEach(item => {

      const row = document.createElement("tr");

      row.innerHTML = `
        <td><strong>${item.product_name}</strong></td>
        <td>${item.category}</td>
        <td>${item.current_stock}</td>
        <td>${item.average_daily_sales}</td>
        <td>${item.days_of_inventory_cover} days</td>
        <td class="${item.stock_risk === "CRITICAL" ? "critical" : "high"}">
          ${item.stock_risk}
        </td>
      `;

      riskTable.appendChild(row);

    });

    const topResponse =
      await fetch("/api/analytics/top-sellers");

    const topData =
      await topResponse.json();

    const topTable =
      document.getElementById("topTable");

    topTable.innerHTML = "";

    (topData.top_sellers || []).slice(0, 5).forEach(item => {

      const row = document.createElement("tr");

      row.innerHTML = `
        <td><strong>${item.product_name}</strong></td>
        <td>${item.units_sold}</td>
        <td>₹${Number(item.revenue).toLocaleString()}</td>
      `;

      topTable.appendChild(row);

    });

  } catch (error) {

    console.error(error);

    document.getElementById("riskTable").innerHTML =
      `<tr><td colspan="6">Unable to load data. Please refresh.</td></tr>`;

  }
}

loadDashboard();
</script>

</body>
</html>
